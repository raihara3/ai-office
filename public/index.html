<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Office</title>
  <script>
    // Applied before the stylesheet paints so a stored dark theme never
    // flashes light on load. localStorage can throw when storage is blocked
    // (e.g. cookies disabled); fall back to the system preference then.
    let storedTheme = null;
    try {
      storedTheme = localStorage.getItem('ai-office-theme');
    } catch {
      // Storage unavailable; the system preference below decides.
    }
    document.documentElement.dataset.theme =
      storedTheme ??
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header id="appbar">
      <div id="brand">
        <svg id="brand-logo" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="2" y="3" width="12" height="12" fill="#2f6fed"/>
          <rect x="4" y="5" width="2" height="2" fill="#ffffff"/>
          <rect x="7" y="5" width="2" height="2" fill="#ffffff"/>
          <rect x="10" y="5" width="2" height="2" fill="#ffffff"/>
          <rect x="4" y="8" width="2" height="2" fill="#ffffff"/>
          <rect x="7" y="8" width="2" height="2" fill="#ffe9a8"/>
          <rect x="10" y="8" width="2" height="2" fill="#ffffff"/>
          <rect x="4" y="11" width="2" height="2" fill="#ffe9a8"/>
          <rect x="10" y="11" width="2" height="2" fill="#ffffff"/>
          <rect x="7" y="11" width="2" height="4" fill="#1b3f8f"/>
          <rect x="6" y="1" width="4" height="2" fill="#1b3f8f"/>
        </svg>
        <span id="brand-word">AI OFFICE</span>
      </div>
      <nav id="view-tabs" role="tablist">
        <button type="button" class="view-tab active" data-view="office" role="tab" aria-selected="true">オフィス</button>
        <button type="button" class="view-tab" data-view="board" role="tab" aria-selected="false">ボード</button>
        <button type="button" class="view-tab" data-view="inbox" role="tab" aria-selected="false">インボックス<span id="inbox-tab-badge" class="tab-badge" hidden></span></button>
      </nav>
      <div id="appbar-actions">
        <button type="button" id="theme-toggle" title="ダークモードに切り替え">🌙</button>
        <button type="button" id="settings-open" title="オフィス名などの設定を変更します">⚙ 設定</button>
        <button type="button" id="team-add" title="新しいチームを追加します">＋ チーム</button>
        <button type="button" id="card-add" class="primary-button">＋ タスク</button>
      </div>
    </header>
    <div id="kanban-strip"></div>
    <div id="content">
      <section id="office-wrap">
        <div id="office-scroll">
          <canvas id="office" width="960" height="600"></canvas>
        </div>
        <div id="office-zoom" role="group" aria-label="ズーム">
          <button type="button" id="office-zoom-out" title="縮小">−</button>
          <button type="button" id="office-zoom-fit" title="全体表示に戻す">⤢</button>
          <button type="button" id="office-zoom-in" title="拡大">＋</button>
        </div>
      </section>
      <section id="board-view" hidden>
        <div id="board-columns"></div>
      </section>
      <aside id="panel">
        <header id="panel-head">
          <svg id="inbox-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
            <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
          </svg>
          <h1>インボックス</h1>
          <span id="inbox-summary"></span>
        </header>
        <div id="inbox-list"></div>
      </aside>
    </div>
  </main>
  <aside id="drawer" hidden>
    <header id="drawer-head">
      <h2 id="drawer-title"></h2>
      <button type="button" id="drawer-close" title="閉じる">✕</button>
    </header>
    <div id="drawer-body">
      <div id="card-detail" class="drawer-section" hidden></div>
      <form id="card-form" class="drawer-section" hidden>
        <label>件名
          <input id="card-title" placeholder="タスクの件名" required>
        </label>
        <label>内容・手順(担当のプロンプトにそのまま入ります)
          <textarea id="card-body" rows="6"></textarea>
        </label>
        <label>担当
          <select id="card-assignee"></select>
        </label>
        <div class="form-actions">
          <button type="submit" id="card-file" class="primary-button">起票する</button>
        </div>
      </form>
      <div id="activity-wrap" class="drawer-section" hidden>
        <div id="activity-view"></div>
      </div>
      <form id="resident-form" class="drawer-section" hidden>
        <label>ID(半角英小文字・数字・ハイフン)
          <input id="resident-name" pattern="[a-z0-9][a-z0-9-]*" required>
        </label>
        <label>表示名
          <input id="resident-display-name" required>
        </label>
        <div class="form-row">
          <label>CLI
            <select id="resident-cli">
              <option value="claude">Claude Code</option>
              <option value="codex">Codex</option>
              <option value="gemini">Gemini</option>
            </select>
          </label>
          <label>権限
            <select id="resident-mode">
              <option value="read-only">読み取りのみ</option>
              <option value="edit">編集あり</option>
            </select>
          </label>
        </div>
        <label>モデル(候補から選択、またはフルモデルIDを入力)
          <input id="resident-model" list="resident-model-options" placeholder="空欄でCLIの既定モデル">
          <datalist id="resident-model-options"></datalist>
        </label>
        <label>作業ディレクトリ
          <input id="resident-working-directory" placeholder="~/dev/repo" required>
        </label>
        <label>役割
          <select id="resident-role">
            <option value="board">カンバン(担当カードを実行)</option>
            <option value="scheduled">定期実行(指示書を実行)</option>
          </select>
        </label>
        <div id="role-scheduled-fields" hidden>
          <label>トリガー
            <select id="resident-trigger-type">
              <option value="schedule">曜日と時刻を指定</option>
              <option value="interval">一定間隔</option>
            </select>
          </label>
          <div id="trigger-schedule">
            <div class="weekday-row" id="schedule-days"></div>
            <label>時刻(カンマ区切り)
              <input id="schedule-times" placeholder="09:00">
            </label>
          </div>
          <div id="trigger-interval" hidden>
            <label>間隔(分)
              <input id="interval-minutes" type="number" min="1" value="30">
            </label>
            <div class="weekday-row" id="interval-days"></div>
            <div class="form-row">
              <label>稼働開始
                <input id="interval-start" type="time">
              </label>
              <label>稼働終了
                <input id="interval-end" type="time">
              </label>
            </div>
          </div>
          <label>事前チェックコマンド(出力が空なら実行をスキップ。空欄なら毎回実行)
            <input id="resident-precheck" placeholder="gh issue list --label needs-ai">
          </label>
        </div>
        <label>指示書(INSTRUCTIONS.md)
          <textarea id="resident-instructions" rows="8" placeholder="この常駐員の役割・手順を書いてください"></textarea>
        </label>
        <label class="checkbox-label">
          <input id="resident-enabled" type="checkbox" checked> 稼働する(オフで一時停止)
        </label>
        <p id="resident-error" class="form-error" hidden></p>
        <div class="form-actions">
          <button type="submit" id="resident-save" class="primary-button">保存</button>
          <button type="button" id="resident-run">今すぐ実行</button>
          <button type="button" id="resident-unassign" class="danger-button">割り当て解除</button>
        </div>
      </form>
      <form id="team-form" class="drawer-section" hidden>
        <label>チーム名
          <input id="team-name" required maxlength="40" placeholder="開発チーム">
        </label>
        <label>席数(1〜12)
          <input id="team-seat-count" type="number" min="1" max="12" value="6" required>
        </label>
        <p id="team-error" class="form-error" hidden></p>
        <div class="form-actions">
          <button type="submit" id="team-save" class="primary-button">保存</button>
          <button type="button" id="team-delete" class="danger-button">チームを削除</button>
        </div>
      </form>
      <form id="settings-form" class="drawer-section" hidden>
        <label>オフィス名(10文字以内)
          <input id="office-name" required maxlength="10" placeholder="AI OFFICE">
        </label>
        <p id="settings-error" class="form-error" hidden></p>
        <div class="form-actions">
          <button type="submit" id="settings-save" class="primary-button">保存</button>
        </div>
      </form>
    </div>
  </aside>
  <script type="module" src="office.js"></script>
  <script type="module" src="office-client.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
